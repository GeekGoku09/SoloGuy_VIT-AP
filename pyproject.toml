[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-t2d"
version = "0.1.0"
description = "PoC Digital Twin for Prediabetes and Type 2 Diabetes Glucose Event Forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TEAM_NAME"}]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=4.0.0",
    "shap>=0.42.0",
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pytest>=7.3.0",
    "ruff>=0.1.0",
    "python-pptx>=0.6.21",
    "pyyaml>=6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
